# Profil docker - sengaja LENGKAP, bukan hanya menimpa beberapa baris.
# Alasannya: application.properties di-gitignore, jadi di clone yang bersih
# file itu tidak ada dan tidak bisa dijadikan basis. Semua nilai rahasia
# (DB) datang dari environment variable di docker-compose.yml.

spring.application.name=user-service
server.port=8082
server.forward-headers-strategy=framework

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=user_schema
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.jpa.open-in-view=false

eureka.client.service-url.defaultZone=${EUREKA_URL}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
