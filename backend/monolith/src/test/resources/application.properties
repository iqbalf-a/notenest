# Config khusus test. H2 in-memory dalam mode PostgreSQL - cukup untuk
# membuktikan seluruh context gabungan benar-benar bisa start dan alur
# auth -> note -> share jalan, tanpa perlu PostgreSQL yang hidup.
spring.datasource.url=jdbc:h2:mem:notenest-monolith;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Nilai test, bukan rahasia: base64 dari "test-only-secret-for-monolith-context-test-12345"
jwt.secret=dGVzdC1vbmx5LXNlY3JldC1mb3ItbW9ub2xpdGgtY29udGV4dC10ZXN0LTEyMzQ1
jwt.expiration=86400000

notenest.cors.allowed-origins=http://localhost:5173

spring.autoconfigure.exclude=org.springframework.cloud.openfeign.FeignAutoConfiguration,org.springframework.cloud.openfeign.hateoas.FeignHalAutoConfiguration,org.springframework.cloud.openfeign.encoding.FeignAcceptGzipEncodingAutoConfiguration,org.springframework.cloud.openfeign.encoding.FeignContentGzipEncodingAutoConfiguration,org.springframework.cloud.openfeign.loadbalancer.FeignLoadBalancerAutoConfiguration
