# Build gabungan: satu proses, satu port, satu koneksi database.
# Semua nilai yang berbeda antar-lingkungan datang dari environment variable,
# karena file ini ikut ter-commit (tidak ada rahasia di sini).

spring.application.name=notenest-monolith

# Render/Railway menyuntikkan PORT sendiri; 8080 dipakai saat jalan lokal.
server.port=${PORT:8080}
# Hormati X-Forwarded-* dari proxy platform, supaya URL di spec OpenAPI benar
server.forward-headers-strategy=framework

# ===== DATABASE =====
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Postgres gratis (Neon/Supabase) punya batas koneksi yang kecil, dan instance
# 512 MB tidak sanggup memegang pool besar. Default Hikari 10 terlalu rakus.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
# Neon menidurkan compute setelah 5 menit; koneksi basi harus dibuang sebelum dipakai.
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.idle-timeout=120000

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# CATATAN schema-per-service: build microservices memberi tiap service schema
# sendiri (auth_schema/user_schema/note_schema) lewat hibernate.default_schema.
# Satu aplikasi hanya punya satu konfigurasi JPA, jadi di sini semua tabel hidup
# di schema default. Pemisahannya memang konsep deployment - dan di deployment
# ini memang cuma ada satu service.

# ===== JWT =====
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ===== CORS =====
# Isi dengan origin frontend yang sudah dideploy, mis. https://notenest.vercel.app
notenest.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ===== ACTUATOR =====
# /actuator/health dipakai health check platform sekaligus target ping anti-tidur.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ===== SISA SPRING CLOUD =====
# spring-cloud-openfeign-core ada di classpath HANYA demi tipe @FeignClient
# (lihat komentar di pom). Seluruh auto-config bawaannya dimatikan: tanpa
# spring-cloud-commons, FeignAutoConfiguration gagal introspeksi dan context
# tidak bisa start - dan kalaupun jalan, mesin Feign memang tidak dipakai
# di sini. Mematikannya sekalian memangkas kerja startup, yang berharga
# di free tier dengan cold start ~1 menit.
spring.autoconfigure.exclude=org.springframework.cloud.openfeign.FeignAutoConfiguration,org.springframework.cloud.openfeign.hateoas.FeignHalAutoConfiguration,org.springframework.cloud.openfeign.encoding.FeignAcceptGzipEncodingAutoConfiguration,org.springframework.cloud.openfeign.encoding.FeignContentGzipEncodingAutoConfiguration,org.springframework.cloud.openfeign.loadbalancer.FeignLoadBalancerAutoConfiguration
