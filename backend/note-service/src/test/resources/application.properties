# Config khusus test. H2 in-memory dalam mode PostgreSQL: cukup untuk memastikan
# query HQL buatan tangan di NoteRepository benar-benar bisa di-parse dan dijalankan,
# tanpa perlu PostgreSQL yang hidup.
spring.datasource.url=jdbc:h2:mem:notenest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Service discovery tidak relevan di test repository
eureka.client.enabled=false
spring.cloud.discovery.enabled=false
