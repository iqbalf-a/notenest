# Profil docker - LENGKAP, karena application.properties di-gitignore dan
# tidak ada di clone yang bersih. Nilai rahasia datang dari environment variable.

# Application
spring.application.name=api-gateway
server.port=8080

# Eureka - gateway juga daftar ke eureka + tanya alamat service dari sini
eureka.client.service-url.defaultZone=${EUREKA_URL}

# JWT - harus SAMA dengan jwt.secret auth-service (untuk verifikasi signature token)
jwt.secret=${JWT_SECRET}

# ===== ROUTING - BUSINESS =====
# lb:// = load-balanced: tanya Eureka alamat service, bukan hardcode port

# Rute 0: /api/auth/** -> auth-service
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

# Rute 1: /api/users/** -> user-service
spring.cloud.gateway.routes[1].id=user-service
spring.cloud.gateway.routes[1].uri=lb://user-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/users/**

# Rute 2: /api/notes/** -> note-service
spring.cloud.gateway.routes[2].id=note-service
spring.cloud.gateway.routes[2].uri=lb://note-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/notes/**

# ===== ROUTING - API DOCS =====
# /docs/specs/xxx -> /v3/api-docs milik tiap service (SetPath = tulis ulang path)

# Rute 3: spec auth-service
spring.cloud.gateway.routes[3].id=auth-service-docs
spring.cloud.gateway.routes[3].uri=lb://auth-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/docs/specs/auth
spring.cloud.gateway.routes[3].filters[0]=SetPath=/v3/api-docs

# Rute 4: spec user-service
spring.cloud.gateway.routes[4].id=user-service-docs
spring.cloud.gateway.routes[4].uri=lb://user-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/docs/specs/users
spring.cloud.gateway.routes[4].filters[0]=SetPath=/v3/api-docs

# Rute 5: spec note-service
spring.cloud.gateway.routes[5].id=note-service-docs
spring.cloud.gateway.routes[5].uri=lb://note-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/docs/specs/notes
spring.cloud.gateway.routes[5].filters[0]=SetPath=/v3/api-docs

# Rute 6: /internal/** SENGAJA didaftarkan supaya JwtAuthFilter sempat jalan dan
# menolaknya dengan 403 yang jelas. Tanpa rute, gateway hanya menjawab 404 dan
# tidak kelihatan bahwa endpoint ini memang ditutup. Request tidak pernah benar-benar
# diteruskan - filter menolak lebih dulu (INTERNAL_PATTERNS).
spring.cloud.gateway.routes[6].id=internal-blocked
spring.cloud.gateway.routes[6].uri=lb://user-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/internal/**

# ===== CORS =====
# Origin frontend yang boleh memanggil gateway dari browser (Vite default: 5173).
# Pisahkan dengan koma kalau lebih dari satu.
notenest.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Actuator
management.endpoints.web.exposure.include=health,info
