# Config bersama untuk SEMUA service NoteNest.
# File ini di-serve oleh Config Server ke setiap service yang connect
# (http://localhost:8888/<nama-service>/default).

# Eureka - semua service daftar ke alamat yang sama
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Actuator - semua service expose health & info
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
