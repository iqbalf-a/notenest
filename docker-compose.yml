# NoteNest di branch ini: 1 aplikasi + 1 database.
#
#   cp .env.example .env    # lalu isi nilainya
#   docker compose up --build
#
# Bandingkan dengan branch dev, yang menjalankan 7 container (Eureka, Config
# Server, Gateway, tiga service domain, dan Postgres).

services:

  postgres:
    image: postgres:16-alpine
    container_name: notenest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Dibuka supaya bisa dilihat dari DBeaver/psql saat mengembangkan.
      # Tutup baris ini kalau compose ini dipakai di server yang terekspos.
      - "5432:5432"
    networks:
      - notenest
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    container_name: notenest-api
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    ports:
      - "8080:8080"
    # Meniru batas free tier Render (512 MB / 0.1 CPU) supaya masalah memori
    # ketahuan di laptop, bukan setelah dideploy.
    mem_limit: 512m
    cpus: 0.5
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - notenest

networks:
  notenest:
    driver: bridge
    name: notenest

volumes:
  postgres_data:
    name: notenest-postgres-data
